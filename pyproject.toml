[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wan-depth-workflow"
version = "0.3.0"
description = "Independent depth-map, evidence-analysis, WAN prompting, and Pika Wan 3.0 API utilities."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Halevora LLC"}]
dependencies = []

[project.optional-dependencies]
local-depth = [
  "numpy>=1.26,<3",
  "Pillow>=10,<12",
  "onnxruntime>=1.18,<2",
]
analysis = [
  "numpy>=1.26,<3",
  "Pillow>=10,<12",
  "opencv-python-headless>=4.10,<5",
]
all = [
  "numpy>=1.26,<3",
  "Pillow>=10,<12",
  "opencv-python-headless>=4.10,<5",
  "onnxruntime>=1.18,<2",
]
dev = ["pytest>=8,<9"]

[project.scripts]
wandepth = "switchdepth.cli:main"
switchdepth = "switchdepth.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
